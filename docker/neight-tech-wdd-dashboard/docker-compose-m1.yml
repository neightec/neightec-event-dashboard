version: '3.7'
services:
  neight-tech-wdd-dashboard-psql:
    container_name: neight-tech-wdd-dashboard-psql
    ports:
      - '5481:5432'
    environment:
      - POSTGRESQL_PASSWORD=8qLKJbXuA9bwkNMreWb8
      - POSTGRES_HOST_AUTH_METHOD=trust
    image: postgres:11.14-alpine
    restart: unless-stopped
    volumes:
      - 'neight-tech-wdd-dashboard-psql-volume:/bitnami/postgresql'
      - ./postgresql/init-postgresql.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      neight-tech-wdd-dashboard-dev-env:
        ipv4_address: 172.90.1.81
  # neight-tech-wdd-dashboard-mariadb:
  #   container_name: neight-tech-wdd-dashboard-mariadb
  #   ports:
  #     - '3308:3306'
  #   image: mariadb:latest
  #   restart: unless-stopped
  #   environment:
  #     - MYSQL_USER=neight
  #     - MYSQL_PASSWORD=8qLKJbXuA9bwkNMreWb8
  #     - MYSQL_ROOT_PASSWORD=8qLKJbXuA9bwkNMreWb8
  #     - MYSQL_DATABASE=neight-tech-wdd-dashboard-mariadb
  #   networks:
  #     neight-tech-wdd-dashboard-dev-env:
  #       ipv4_address: 172.90.1.82
  neight-tech-wdd-dashboard-redis:
    container_name: neight-tech-wdd-dashboard-redis
    ports:
      - '6379:6379'
    image: redis:6.2-alpine
    command: redis-server --save 20 1 --loglevel warning --requirepass somePasswordRedis
    restart: unless-stopped
    environment:
      - REDIS_HOST=cache
      - REDIS_PORT=6379
      - REDIS_PASSWORD=somePasswordRedis
    networks:
      neight-tech-wdd-dashboard-dev-env:
        ipv4_address: 172.90.1.82
volumes:
  neight-tech-wdd-dashboard-psql-volume:
    name: neight-tech-wdd-dashboard-psql-data
  neight-tech-wdd-dashboard-redis-volume:
    name: neight-tech-wdd-dashboard-redis-data
    
networks:
  neight-tech-wdd-dashboard-dev-env:
    ipam:
      driver: default
      config:
        - subnet: 172.90.1.0/24